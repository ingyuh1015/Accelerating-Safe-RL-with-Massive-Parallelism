[project]
name = "massive-saferl"
version = "0.1.0"
description = "Safe reinforcement learning with MuJoCo MJX and MuJoCo Warp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "jax==0.6.2",
  "flax==0.10.7",
  "optax==0.2.7",
  "mujoco==3.6.0",
  "mujoco-mjx==3.6.0",
  "pyyaml>=6.0.1,<7",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "flashbax==0.1.3",
  "gymnasium>=1.0,<2",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.5,<1",
  "pillow>=10,<12",
  "wandb>=0.19.11,<0.21",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.6.2", "mujoco-mjx[warp]==3.6.0", "warp-lang==1.11.1"]
tpu = ["jax[tpu]==0.6.2"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "massive_saferl",
  "massive_saferl.utils",
  "massive_saferl.algos",
  "massive_saferl.train",
  "massive_saferl.train_warp",
  "massive_saferl.eval",
  "massive_saferl.eval_warp",
  "mjx_safetygym",
  "mjx_safetygym.agents",
  "mjx_safetygym.assets",
  "mjx_safetygym.assets.geoms",
  "mjx_safetygym.assets.mocaps",
  "mjx_safetygym.assets.objects",
  "mjx_safetygym.bases",
  "mjx_safetygym.tasks",
  "mjx_safetygym.tasks.safe_multi_agent",
  "mjx_safetygym.tasks.safe_multi_agent.multi_goal",
  "mjx_safetygym.tasks.safe_multi_agent.velocity",
  "mjx_safetygym.tasks.safe_navigation",
  "mjx_safetygym.tasks.safe_navigation.button",
  "mjx_safetygym.tasks.safe_navigation.circle",
  "mjx_safetygym.tasks.safe_navigation.goal",
  "mjx_safetygym.tasks.safe_navigation.push",
  "mjx_safetygym.tasks.safe_velocity",
  "mjx_safetygym.utils",
  "mjx_safetygym.vector",
  "mjx_safetygym.wrappers",
  "mjx_locomotion",
  "mjx_locomotion.xmls",
  "archieve",
  "archieve.utils",
  "archieve.algos",
  "archieve.envs",
  "archieve.envs.agents",
  "archieve.envs.tasks",
  "archieve.train",
  "archieve.eval",
]

[tool.setuptools.package-dir]
"massive_saferl" = "massive-safeRL"
"mjx_safetygym" = "mjx_safetygym"
"mjx_locomotion" = "mjx_locomotion"
"archieve" = "archieve"

[tool.setuptools.package-data]
"massive_saferl" = ["yaml/**/*.yaml", "eval/assets/*.png", "eval/assets/LICENSE", "py.typed"]
"mjx_safetygym" = ["agents/xmls/*.xml", "tasks/*/xmls/*.xml", "LICENSE", "NOTICE"]
"mjx_locomotion" = ["xmls/*.xml", "xmls/meshes/*.stl", "xmls/license.txt"]
"archieve" = ["yaml/**/*.yaml", "py.typed"]
"archieve.envs.agents" = ["*.xml"]
